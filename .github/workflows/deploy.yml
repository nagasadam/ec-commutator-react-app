name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-java@v4 # the Firebase emulator needs Java
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e # builds, serves and tests the production bundle
      - name: Publish Firestore rules
        if: github.event_name == 'push'
        continue-on-error: true # a rules hiccup must not stop the site from deploying; check this step if it shows red
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret or project id: rules not published (see DEPLOY.md)."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "const k=require(process.argv[1]);console.log('Publishing as',k.client_email,'for project',k.project_id)" "$RUNNER_TEMP/sa.json" || { echo 'FIREBASE_SERVICE_ACCOUNT is not valid JSON: paste the whole downloaded key file.'; exit 1; }
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only firestore:rules --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - run: npm run build
        if: github.event_name != 'pull_request'
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
